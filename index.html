<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家計簿">
  <title>家計簿</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- ===== 入力画面 ===== -->
    <section id="view-input" class="view active">
      <header class="topbar"><h1>記入</h1></header>

      <div class="type-toggle" role="tablist">
        <button type="button" class="type-btn active" data-type="expense">支出</button>
        <button type="button" class="type-btn" data-type="income">収入</button>
      </div>

      <form id="entry-form" autocomplete="off">
        <label class="amount-wrap">
          <span class="yen">¥</span>
          <input id="amount" type="text" inputmode="numeric" placeholder="0" aria-label="金額">
        </label>

        <div class="chips" id="category-chips"></div>

        <div class="row">
          <label class="field">
            <span>日付</span>
            <input id="date" type="date">
          </label>
        </div>
        <label class="field">
          <span>メモ（任意）</span>
          <input id="memo" type="text" placeholder="例：スーパー">
        </label>

        <button type="submit" class="save-btn">記録する</button>
      </form>

      <div id="toast" class="toast" aria-live="polite"></div>

      <h2 class="sub">最近の記録</h2>
      <ul id="recent-list" class="entry-list"></ul>
    </section>

    <!-- ===== 集計画面 ===== -->
    <section id="view-summary" class="view">
      <header class="topbar"><h1>集計</h1></header>

      <div class="period-toggle">
        <button type="button" class="period-btn" data-period="week">週</button>
        <button type="button" class="period-btn active" data-period="month">月</button>
      </div>

      <div class="period-nav">
        <button type="button" id="prev-period" aria-label="前へ">‹</button>
        <span id="period-label"></span>
        <button type="button" id="next-period" aria-label="次へ">›</button>
      </div>

      <div class="totals">
        <div class="total-card income"><span>収入</span><strong id="sum-income">¥0</strong></div>
        <div class="total-card expense"><span>支出</span><strong id="sum-expense">¥0</strong></div>
        <div class="total-card diff"><span>差分（収入−支出）</span><strong id="sum-diff">¥0</strong></div>
      </div>

      <h2 class="sub">支出の内訳</h2>
      <ul id="breakdown" class="breakdown"></ul>

      <h2 class="sub">この期間の記録</h2>
      <ul id="period-list" class="entry-list"></ul>
    </section>

    <!-- ===== 設定画面 ===== -->
    <section id="view-settings" class="view">
      <header class="topbar"><h1>設定</h1></header>

      <div class="card">
        <h2 class="sub">バックアップ</h2>
        <p class="note">データはこのスマホの中だけに保存されています。機種変更やブラウザのデータ削除の前に書き出しておいてください。</p>
        <button type="button" id="export-btn" class="ghost-btn">データを書き出す（JSON）</button>
        <button type="button" id="csv-btn" class="ghost-btn">CSVで書き出す</button>
        <label class="ghost-btn file-btn">
          データを読み込む
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </label>
      </div>

      <div class="card">
        <h2 class="sub">カテゴリ</h2>
        <p class="note">カンマ区切りで編集できます。</p>
        <label class="field"><span>支出</span><input id="cat-expense" type="text"></label>
        <label class="field"><span>収入</span><input id="cat-income" type="text"></label>
        <button type="button" id="save-cats" class="ghost-btn">カテゴリを保存</button>
      </div>

      <div class="card">
        <h2 class="sub">週の始まり</h2>
        <select id="week-start" class="select">
          <option value="1">月曜日</option>
          <option value="0">日曜日</option>
        </select>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button type="button" class="tab active" data-view="input"><span class="ic">＋</span>記入</button>
    <button type="button" class="tab" data-view="summary"><span class="ic">▤</span>集計</button>
    <button type="button" class="tab" data-view="settings"><span class="ic">⚙</span>設定</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
